[tool.pyright]
include = ["sdk", "tests/sdk/authoring_surface.py"]
extraPaths = ["sdk"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
include = ["sdk/**/*.py", "sdk/**/*.pyi", "tests/sdk/authoring_surface.py"]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PYI", "RUF"]
